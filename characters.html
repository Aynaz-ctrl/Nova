<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>انتخاب کاراکتر | AyNova AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="characters.css?v=1" />
  </head>
  <body>
    <header class="topbar">
      <a class="wordmark" href="index.html" aria-label="Aynova AI"><span class="wordmark-spark">✦</span><span>Aynova</span><em>AI</em></a>
      <a class="home" href="index.html" aria-label="خانه">⌂</a>
    </header>

    <main>
      <section class="character-page" aria-labelledby="page-title">
        <h1 id="page-title">کاراکتر همراهت را انتخاب کن</h1>
        <p class="intro">سلام آیناز، کاراکتر همراهت را انتخاب کن.</p>
        <form action="#" class="character-form">
          <label class="character-card" for="girl">
            <input id="girl" name="character" type="radio" value="girl" required />
            <span class="portrait girl" aria-hidden="true"></span>
            <span class="card-copy"><strong>کاراکتر دختر</strong><small>همراهی خلاق برای مسیر یادگیری تو.</small></span>
            <span class="radio-mark" aria-hidden="true"></span>
          </label>
          <label class="character-card" for="boy">
            <input id="boy" name="character" type="radio" value="boy" />
            <span class="portrait boy" aria-hidden="true"></span>
            <span class="card-copy"><strong>کاراکتر پسر</strong><small>همراهی آرام برای کشف چیزهای تازه.</small></span>
            <span class="radio-mark" aria-hidden="true"></span>
          </label>
          <button type="submit">تکمیل پروفایل</button>
        </form>
      </section>
    </main>
  </body>
</html>
