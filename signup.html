<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>اطلاعات اولیه | AyNova AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="signup.css?v=1" />
  </head>
  <body>
    <header class="topbar">
      <a class="wordmark" href="index.html" aria-label="Aynova AI">
        <span class="wordmark-spark">✦</span><span>Aynova</span><em>AI</em>
      </a>
      <a class="home" href="index.html" aria-label="خانه">⌂</a>
    </header>

    <main>
      <section class="form-card" aria-labelledby="page-title">
        <div class="form-title-row">
          <div>
            <p>شروع مسیر</p>
            <h1 id="page-title">اطلاعات اولیه</h1>
          </div>
          <span>مرحله ۱ از ۲</span>
        </div>

        <form action="characters.html?v=1" novalidate>
          <label for="first-name">نام</label>
          <input id="first-name" name="first-name" type="text" required />

          <label for="last-name">نام خانوادگی</label>
          <input id="last-name" name="last-name" type="text" required />

          <label for="parent-phone">شماره تماس والد</label>
          <input id="parent-phone" name="parent-phone" type="tel" inputmode="numeric" placeholder="۰۹۱۲۱۲۳۴۵۶۷" required />

          <label for="age">سن</label>
          <select id="age" name="age" required>
            <option value="" selected disabled>انتخاب کن</option>
            <option value="8">۸ سال</option><option value="9">۹ سال</option><option value="10">۱۰ سال</option>
            <option value="11">۱۱ سال</option><option value="12">۱۲ سال</option><option value="13">۱۳ سال</option>
            <option value="14">۱۴ سال</option><option value="15">۱۵ سال</option><option value="16">۱۶ سال</option>
          </select>

          <fieldset>
            <legend>جنسیت</legend>
            <div class="gender-grid">
              <label class="choice"><span>دختر</span><input name="gender" type="radio" value="girl" required /></label>
              <label class="choice"><span>پسر</span><input name="gender" type="radio" value="boy" /></label>
            </div>
          </fieldset>

          <button type="submit">ادامه</button>
        </form>
      </section>
    </main>
  </body>
</html>
